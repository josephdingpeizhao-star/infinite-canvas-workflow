    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}a{color:inherit}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--primary);color:var(--bg)}.env{font-size:13px;font-weight:700;background:var(--danger-soft);color:var(--danger);padding:5px 10px;border-radius:999px}main{width:min(820px,calc(100% - 36px));margin:0 auto;padding:42px 0 64px}.fail-mark{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--danger-soft);color:var(--danger);font-size:1.5rem;font-weight:900}h1{font-size:2rem;line-height:1.2;letter-spacing:-.02em;margin:14px 0 8px}.lede{margin:0;color:var(--muted)}.notice{margin:25px 0;padding:20px;background:var(--danger-soft);border-radius:12px}.notice strong{display:block;color:var(--danger);font-size:1.05rem;margin-bottom:4px}.kept{border:1px solid var(--line);border-radius:14px;padding:20px}.kept h2{font-size:1.15rem;margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row span{color:var(--muted)}.actions{display:flex;gap:10px;margin-top:24px}.btn{min-height:42px;padding:8px 15px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:750;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--bg)}.btn:hover{filter:brightness(.96)}.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.rule{margin-top:18px;color:var(--muted);font-size:14px}.footer{margin-top:30px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between}@media(max-width:600px){.actions,.footer{flex-direction:column}.btn{width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
